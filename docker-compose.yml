services:
  ollama:
    image: ollama/ollama
    container_name: ollama
    restart: always
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    networks:
      - openmrs-network
    command: serve

volumes:
  ollama:
    name: ollama

networks:
  openmrs-network:
    external: true
